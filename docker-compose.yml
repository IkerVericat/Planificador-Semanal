# Variables de entorno compartidas por los contenedores PHP (php y queue)
x-php-environment: &php-environment
  APP_NAME: Planificador
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?Define APP_KEY en .env}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-planificador}
  DB_USERNAME: ${DB_USERNAME:-planificador}
  DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080}

services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: ./backend
    environment:
      <<: *php-environment
      RUN_MIGRATIONS: "true"
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  queue:
    build:
      context: ./backend
    environment: *php-environment
    command: php artisan queue:work --tries=3 --sleep=3 --max-time=3600
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-planificador}
      POSTGRES_USER: ${DB_USERNAME:-planificador}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Define PGADMIN_PASSWORD en .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pg_data:
  pgadmin_data:
  storage_data:
