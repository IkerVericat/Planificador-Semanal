# Variables de entorno compartidas por los contenedores PHP (php y queue)
x-php-environment: &php-environment
  APP_NAME: Planificador
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?Define APP_KEY en .env}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-planificador}
  DB_USERNAME: ${DB_USERNAME:-planificador}
  DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
  APP_LOCALE: es
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  # La API no usa sesiones: se autentica con tokens de Sanctum
  SESSION_DRIVER: array
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080}
  # Correo (recuperar contraseña). Sin MAIL_MAILER=smtp los correos solo se escriben en el log
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Planificador}

services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    # Solo desde el propio equipo (en el servidor, desde Internet se entra por Caddy)
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    depends_on:
      - php
    restart: unless-stopped

  # HTTPS en producción: certificado de Let's Encrypt automático para DOMAIN y proxy a nginx.
  # Solo arranca con el perfil "production" (COMPOSE_PROFILES=production en el .env del servidor).
  caddy:
    image: caddy:2.10-alpine
    profiles: ["production"]
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
    restart: unless-stopped

  php:
    build:
      context: ./backend
    environment:
      <<: *php-environment
      RUN_MIGRATIONS: "true"
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  queue:
    build:
      context: ./backend
    environment: *php-environment
    command: php artisan queue:work --tries=3 --sleep=3 --max-time=3600
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-planificador}
      POSTGRES_USER: ${DB_USERNAME:-planificador}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pg_data:
  storage_data:
  caddy_data:
  caddy_config:
