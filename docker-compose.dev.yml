services:
  php:
    build:
      target: dev
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:8080
    volumes:
      - ./backend:/var/www/html
      - vendor_data:/var/www/html/vendor

  # En dev se usa queue:listen (recarga el código en cada job); queue:work lo mantendría en memoria
  queue:
    build:
      target: dev
    command: php artisan queue:listen --tries=1
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - ./backend:/var/www/html
      - vendor_data:/var/www/html/vendor

  # Crea la BD de tests (planificador_test) la primera vez que se inicializa el volumen
  db:
    volumes:
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro

  # Solo en desarrollo. En el servidor, conéctate a la BD con un túnel SSH a 127.0.0.1:5432
  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Define PGADMIN_PASSWORD en .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db
    restart: unless-stopped

  vite:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://nginx
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules_data:/app/node_modules
    depends_on:
      - nginx

volumes:
  pgadmin_data:
  vendor_data:
  node_modules_data:
